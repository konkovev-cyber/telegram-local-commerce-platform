services:
  - type: web
    name: kvartal-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -e "./backend[dev]"
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: PLATFORM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_BOT_SECRET
        value: ""
      - key: REDIS_URL
        value: redis://localhost:6379/0
